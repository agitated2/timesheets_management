[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Node 22 ships a native global WebSocket, which @supabase/supabase-js's
  # realtime client requires. On Node 18 every function that calls createClient
  # crashes with "Node.js 18 detected without native WebSocket support".
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  targetPort = 5173
